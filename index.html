    <title>Sho Katsumata | Portfolio</title>
    <script>
      // Paint the stored (or OS) theme before first paint so the page never
      // flashes light on the way to dark. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* No storage, no preference: the stylesheet default (light) stands. */
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
